repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-gap-flow_logo_light.png
    - docs/images/nf-core-gap-flow_logo_light.png
    - docs/images/nf-core-gap-flow_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/workflows/branch.yml
    - .github/workflows/pr-comment.yml
    - .github/workflows/linting.yml
    - .github/.dockstore.yml
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CODE_OF_CONDUCT.md
    - assets/nf-core-gap-flow_logo_light.png
    - docs/images/nf-core-gap-flow_logo_light.png
    - docs/images/nf-core-gap-flow_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/.dockstore.yml
    - docs/CONTRIBUTING.md
  readme:
    - nextflow_badge

template:
  org: qussai96
  name: gap-flow
  description: A Nextflow pipeline for proteogenomics analysis, integrating peptide
    identification with FragPipe or Casanovo, gene prediction using Tiberius or Helixer,
    and optional VARUS-assisted genome annotation refinement, with downstream GAP-MS
    analysis.
  author: Qussai Abbas, Sonia Blaszczak
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - github
    - igenomes
    - seqera_platform
  is_nfcore: false
